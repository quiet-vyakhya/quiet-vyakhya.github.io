<div class="sidebar-widget" style="margin-bottom: 2rem; padding: 1rem; background: #f9f9f9; border-radius: 8px;">
  <h3 style="margin-top:0;">Reflection Archive</h3>
  
  {% assign postsByYear = site.posts | group_by_exp: "post", "post.date | date: '%B %Y'" %}
  <ul style="list-style-type: none; padding-left: 0;">
    {% for month in postsByYear %}
      <li style="margin-bottom: 0.5rem;">
        <strong>{{ month.name }}</strong>
        <ul style="padding-left: 1rem;">
          {% for post in month.items %}
            <li>
              <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
              <span style="font-size: 0.85em; color: #666;">({{ post.date | date: "%d %b" }})</span>
            </li>
          {% endfor %}
        </ul>
      </li>
    {% endfor %}
  </ul>
</div>
