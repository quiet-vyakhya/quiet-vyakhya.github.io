<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Google Search Console Verification -->
<meta name="google-site-verification" content="eXYLxSCkCZPG2J3o0gJI5GbZBucIl0QTa0VVExJming" />
    {%- feed_meta -%}
    {%- if jekyll.environment == 'production' and site.google_analytics -%}
      {%- include google-analytics.html -%}
    {%- endif -%}
  </head>

  <body>

    {%- include header.html -%}

<main class="page-content" aria-label="Content" style="padding: 20px 0;">
  <div style="max-width: 1100px; margin: 0 auto; padding: 0 15px; display: flex; flex-wrap: wrap; gap: 2rem; align-items: flex-start;">
    
<!-- Main Left Content Area -->
<div class="main-content" style="flex: 1 1 550px; min-width: 0; max-width: 100%;">
  {{ content }}
</div>

    <!-- Right Sidebar Section -->
    <aside class="sidebar-container" style="flex: 0 0 300px; width: 300px; max-width: 100%;">
      {%- include sidebar.html -%}
    </aside>

  </div>
</main>

    {%- include footer.html -%}
<script data-goatcounter="https://quiet-vyakhya.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  </body>

</html>
